plugins {
    id 'org.springframework.boot' version "4.1.0"
    id 'java'
    id 'application'
    id 'org.graalvm.buildtools.native' version "1.1.7"
}

java {
    sourceCompatibility = 25
    targetCompatibility = 25
}

repositories {
    mavenCentral()
}

dependencies {
    implementation "info.picocli:picocli:4.7.7"
    implementation project(':lib:ac-api')
    implementation "net.sf.applecommander:ShrinkItArchive:1.2.2"
    implementation "net.sf.applecommander:applesingle-api:1.2.2"
    implementation "org.applecommander:bastools-api:5.0"
    implementation "org.applecommander:acdasm:6.1"
    implementation "com.google.code.gson:gson:2.14.0"

    annotationProcessor "info.picocli:picocli-codegen:4.7.7"

    testImplementation platform("org.junit:junit-bom:6.1.2")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

application {
    mainClass = 'io.github.applecommander.acx.Main'
}

jar {
    manifest {
        attributes 'Implementation-Title': "AppleCommander 'acx'",
                'Implementation-Version': archiveVersion
    }
}

// Disable all Spring AOT processing
processAot.configure {
    enabled = false;
}
processTestAot.configure {
    enabled = false;
}

bootJar {
  archiveBaseName = 'AppleCommander'
  archiveAppendix = 'acx'
  manifest {
      attributes 'Implementation-Title': "AppleCommander 'acx'",
                  'Implementation-Version': archiveVersion
  }
  from('../../LICENSE')
}

graalvmNative {
    String osName = System.getProperty('os.name').toLowerCase().split()[0]
    String osArch = System.getProperty('os.arch').toLowerCase().split()[0]
    binaries {
        named("main") {
            imageName.set("acx-${osName}-${osArch}-${project.version}")
        }
    }
}
