plugins {
    id 'org.springframework.boot' version "4.1.0"
    id 'application'
    id 'org.graalvm.buildtools.native' version "1.1.6"
}

java {
    sourceCompatibility = 25
    targetCompatibility = 25
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':lib:ac-api')
    implementation "net.sf.applecommander:ShrinkItArchive:1.2.2"
    implementation "net.sf.applecommander:applesingle-api:1.2.2"
    implementation "org.applecommander:bastools-api:5.0"

    compileOnly "org.apache.ant:ant:1.10.17"

    testImplementation platform("org.junit:junit-bom:6.1.2")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

application {
    mainClass = 'com.webcodepro.applecommander.ui.ac'
}

jar {
    manifest {
        attributes 'Implementation-Title': "AppleCommander 'ac'",
                'Implementation-Version': archiveVersion
    }
}

// Disable all Spring AOT processing
processAot.configure {
    enabled = false;
}
processTestAot.configure {
    enabled = false;
}

bootJar {
    archiveBaseName = 'AppleCommander'
    archiveAppendix = 'ac'
    manifest {
        attributes 'Implementation-Title': "AppleCommander 'ac'",
                   'Implementation-Version': archiveVersion
    }
    from('../../LICENSE')
}

graalvmNative {
    String osName = System.getProperty('os.name').toLowerCase().split()[0]
    String osArch = System.getProperty('os.arch').toLowerCase().split()[0]
    binaries {
        named("main") {
            imageName.set("ac-${osName}-${osArch}-${project.version}")
        }
    }
}
